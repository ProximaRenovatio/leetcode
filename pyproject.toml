[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-python"
version = "0.1.0"
description = "Personal LeetCode practice repository"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
